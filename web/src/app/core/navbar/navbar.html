<div class="w-100 bg-black shadow-md z-50" style="height: 50px">
    <div class="d-flex justify-content-between align-items-center px-4 h-100">
        <!-- Logo -->
        <img 
            src="/logos/stepora_white.svg" 
            alt="Home" 
            width="100" 
            height="70"
        />

        <!-- begin::Navigation Links -->
        <nav class="d-flex align-items-center gap-4">
            <ul 
                class="d-flex gap-4 mb-0 list-unstyled" 
                style="font-size: small;"
                >
                <!-- 1. Home -->
                <li class="d-flex flex-row align-items-center">
                    <img 
                        src="/icons/house.svg" 
                        class="me-2"
                        alt="Home" 
                        width="17" 
                        height="17"
                    />
                    <a 
                        class="nav-link text-white active text-decoration-none" 
                        href="#"
                        >
                        Home
                    </a>
                </li>

                <!-- 2. Leaderboard -->
                <li class="d-flex flex-row align-items-center">
                    <img 
                        src="/icons/chart.svg" 
                        class="me-2"
                        alt="Home" 
                        width="17" 
                        height="17"
                    />
                    <a 
                        class="nav-link text-white text-decoration-none" 
                        href="#"
                        >
                        Leaderboard
                    </a>
                </li>

                <!-- 3. Support -->
                <li class="d-flex flex-row align-items-center">
                    <img 
                        src="/icons/xmas-bell.svg" 
                        class="me-2"
                        alt="Home" 
                        width="17" 
                        height="17"
                    />
                    <a 
                        class="nav-link text-white text-decoration-none" 
                        href="#"
                        >
                        Support
                    </a>
                </li>

                <!-- 4. About -->
                <li class="d-flex flex-row align-items-center">
                    <img 
                        src="/icons/users.svg" 
                        class="me-2"
                        alt="About" 
                        width="17" 
                        height="17"
                    />
                    <a 
                        class="nav-link text-white text-decoration-none" 
                        routerLink="/about"
                        >
                        About
                    </a>
                </li>
            </ul>

            <!-- Auth Section -->
            <div class="auth-section" *ngIf="!isLoggedIn">
                <button 
                    class="btn btn-outline-light btn-sm me-2"
                    (click)="goToLogin()"
                    >
                    Login
                </button>
                <button 
                    class="btn btn-primary btn-sm"
                    (click)="goToRegister()"
                    >
                    Sign Up
                </button>
            </div>

            <!-- User Menu -->
            <div class="user-menu position-relative" *ngIf="isLoggedIn">
                <button 
                    class="btn btn-link text-white text-decoration-none p-0"
                    (click)="toggleUserMenu()"
                    >
                    <div class="d-flex align-items-center">
                        <div class="user-avatar me-2">
                            @if (currentUser?.profile_picture) {
                                <img 
                                    [src]="currentUser?.profile_picture" 
                                    [alt]="currentUser?.username" 
                                    class="profile-picture"
                                    (error)="onImageError($event)"
                                />
                            } @else {
                                {{ (currentUser?.username || 'U').charAt(0).toUpperCase() }}
                            }
                        </div>
                        <span style="font-size: small;">{{ currentUser?.username }}</span>
                    </div>
                </button>

                <!-- Dropdown Menu -->
                <div class="user-dropdown" *ngIf="showUserMenu">
                    <div class="dropdown-item user-info">
                        <div class="fw-bold">{{ currentUser?.username }}</div>
                        <div class="text-secondary small">{{ currentUser?.email }}</div>
                    </div>
                    <hr class="dropdown-divider my-1">
                    <button class="dropdown-item" (click)="goToDashboard()">
                        <img 
                            src="/icons/user.svg" 
                            alt="Dashboard" 
                            width="16" 
                            height="16"
                            class="me-2"
                        />
                        My Dashboard
                    </button>
                    <button class="dropdown-item" (click)="logout()">
                        <img 
                            src="/icons/logout.svg" 
                            alt="Logout" 
                            width="16" 
                            height="16"
                            class="me-2"
                        />
                        Logout
                    </button>
                </div>
            </div>
        </nav>
        <!-- end::Navigation Links -->
    </div>
</div>
